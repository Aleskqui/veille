name: Actualisation Veille Hebdomadaire

on:
  schedule:
    # Déclenchement chaque lundi à 07:00 UTC (8h00 ou 9h00 heure de Paris selon l'heure d'hiver/été)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Permet de lancer le robot manuellement à tout moment

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les bibliothèques
        run: pip install feedparser google-generativeai

      - name: Exécuter la génération de veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python updater.py

      - name: Enregistrer les changements sur GitHub
        run: |
          git config --global user.name "Bot Veille"
          git config --global user.email "bot@veille.local"
          git add editions.json
          git commit -m "Auto: Nouvelle édition de veille du $(date +'%Y-%m-%d')" || exit 0
          git push
